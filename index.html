    <title>زينكو - منصة الاستثمار الذكية</title>

    <meta name="robots" content="index, follow" />
    
    <!-- External App (PWA) Optimizations -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="زينكو" />

    <link rel="icon" type="image/svg+xml" href="https://fonts.gstatic.com/s/i/short-term/release/googlesymbols/generating_tokens/default/48px.svg" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-touch-fullscreen" content="yes" />

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => {
              console.log('Zinco SW Registered');
              // Check for updates
              reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                installingWorker.onstatechange = () => {
                  if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('New content is available; please refresh.');
                  }
                };
              };
            })
            .catch(err => console.log('Zinco SW Registration failed', err));
        });
      }
    </script>
